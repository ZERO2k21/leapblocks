<svg width="480" height="360" viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0288D1"/>
      <stop offset="100%" stop-color="#01579B"/>
    </linearGradient>
  </defs>
  <!-- Water gradient -->
  <rect width="480" height="360" fill="url(#water)"/>
  <!-- Light rays -->
  <polygon points="200,0 240,360 160,360" fill="rgba(255,255,255,0.05)"/>
  <polygon points="320,0 360,360 280,360" fill="rgba(255,255,255,0.04)"/>
  <!-- Bubbles -->
  <circle cx="100" cy="80" r="8" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <circle cx="110" cy="120" r="5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <circle cx="350" cy="150" r="10" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <circle cx="380" cy="100" r="6" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="240" cy="60" r="7" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <!-- Seaweed -->
  <path d="M60,360 Q50,300 70,260 Q50,230 65,200" stroke="#388E3C" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M90,360 Q100,310 80,280 Q100,250 85,220" stroke="#43A047" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M400,360 Q410,310 390,270 Q410,240 395,210" stroke="#388E3C" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M430,360 Q420,320 440,290 Q420,260 435,230" stroke="#2E7D32" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Sandy bottom -->
  <ellipse cx="240" cy="370" rx="280" ry="30" fill="#F9A825" opacity="0.6"/>
  <!-- Fish -->
  <g transform="translate(200,150)">
    <ellipse cx="0" cy="0" rx="18" ry="10" fill="#FF7043"/>
    <polygon points="-18,-8 -30,0 -18,8" fill="#FF7043"/>
    <circle cx="10" cy="-3" r="3" fill="white"/>
    <circle cx="11" cy="-3" r="1.5" fill="#333"/>
  </g>
  <g transform="translate(340,230) scale(-1,1)">
    <ellipse cx="0" cy="0" rx="14" ry="8" fill="#42A5F5"/>
    <polygon points="-14,-6 -24,0 -14,6" fill="#42A5F5"/>
    <circle cx="8" cy="-2" r="2.5" fill="white"/>
    <circle cx="9" cy="-2" r="1.2" fill="#333"/>
  </g>
  <!-- Starfish -->
  <text x="160" y="340" font-size="24">⭐</text>
  <!-- Shell -->
  <text x="310" y="345" font-size="20">🐚</text>
</svg>
