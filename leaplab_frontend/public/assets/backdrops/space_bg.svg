<svg width="480" height="360" viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0D2B"/>
      <stop offset="100%" stop-color="#1A237E"/>
    </linearGradient>
  </defs>
  <!-- Night sky -->
  <rect width="480" height="360" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="50" cy="30" r="2" fill="white" opacity="0.9"/>
  <circle cx="120" cy="80" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="200" cy="20" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="280" cy="60" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="350" cy="25" r="2" fill="white" opacity="0.9"/>
  <circle cx="430" cy="70" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="80" cy="130" r="1" fill="white" opacity="0.5"/>
  <circle cx="160" cy="110" r="2" fill="white" opacity="0.8"/>
  <circle cx="380" cy="120" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="460" cy="40" r="1" fill="white" opacity="0.7"/>
  <circle cx="30" cy="200" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="450" cy="180" r="2" fill="white" opacity="0.6"/>
  <!-- Planet -->
  <circle cx="380" cy="100" r="30" fill="#CE93D8" opacity="0.8"/>
  <ellipse cx="380" cy="100" rx="45" ry="8" fill="none" stroke="#CE93D8" stroke-width="3" opacity="0.5" transform="rotate(-20,380,100)"/>
  <!-- Moon -->
  <circle cx="100" cy="80" r="25" fill="#FFF9C4"/>
  <circle cx="90" cy="75" r="6" fill="#FFF176" opacity="0.3"/>
  <circle cx="110" cy="85" r="4" fill="#FFF176" opacity="0.3"/>
  <!-- Ground / planet surface -->
  <ellipse cx="240" cy="380" rx="300" ry="50" fill="#4A148C" opacity="0.8"/>
  <ellipse cx="240" cy="375" rx="280" ry="40" fill="#6A1B9A" opacity="0.6"/>
  <!-- Craters -->
  <ellipse cx="150" cy="350" rx="20" ry="8" fill="#38006b" opacity="0.4"/>
  <ellipse cx="320" cy="345" rx="15" ry="6" fill="#38006b" opacity="0.3"/>
  <!-- Shooting star -->
  <line x1="250" y1="30" x2="300" y2="60" stroke="white" stroke-width="2" opacity="0.6"/>
  <circle cx="250" cy="30" r="3" fill="white" opacity="0.8"/>
</svg>
