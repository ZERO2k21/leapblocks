appId: com.creoleap.leapblocks
productName: LeapLab
copyright: Copyright © 2026 Creoleap Technologies Pvt. Ltd.
directories:
  output: out
  buildResources: .
files:
  - dist/**/*
  - package.json
  - node_modules/**/*
  - src/creova/apk/**/*
asar: true
asarUnpack:
  - node_modules/serialport/**/*
  - node_modules/@serialport/**/*
npmRebuild: false
win:
  icon: public/assets/leaplabicon.ico
  requestedExecutionLevel: asInvoker

  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: LeapLab
  menuCategory: Creoleap
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  include: installer/installer.nsh
extraResources:
  - from: public
    to: public
    filter:
      - "**/*"
  - from: src/creova/apk/tools
    to: tools
    filter:
      - "**/*"
  # arduino-cli bundled directly — Electra ONLY uses this binary,
  # never system-installed arduino-cli. See src/utils/ensureArduinoCli.ts
  - from: src/drivers/arduino-cli
    to: arduino-cli
    filter:
      - "**/*"
