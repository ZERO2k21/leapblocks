<svg width="480" height="360" viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Yellow background -->
  <rect width="480" height="360" fill="#FFD54F"/>

  <!-- Outer border with entry (bottom-left gap) and exit (top gap near apple) -->
  <!-- Top wall: gap near left for exit to apple -->
  <line x1="0" y1="8" x2="80" y2="8" stroke="#222" stroke-width="6"/>
  <line x1="140" y1="8" x2="480" y2="8" stroke="#222" stroke-width="6"/>
  <!-- Right wall -->
  <line x1="474" y1="4" x2="474" y2="360" stroke="#222" stroke-width="6"/>
  <!-- Bottom wall: gap at left for entry -->
  <line x1="80" y1="354" x2="480" y2="354" stroke="#222" stroke-width="6"/>
  <!-- Left wall: gap at bottom for entry -->
  <line x1="6" y1="0" x2="6" y2="280" stroke="#222" stroke-width="6"/>

  <!-- ═══ SIMPLE INTERIOR WALLS ═══ -->

  <!-- Large L-shape top-left -->
  <line x1="6" y1="70" x2="160" y2="70" stroke="#222" stroke-width="5"/>
  <line x1="160" y1="70" x2="160" y2="200" stroke="#222" stroke-width="5"/>

  <!-- Box in upper-left area -->
  <line x1="60" y1="120" x2="110" y2="120" stroke="#222" stroke-width="5"/>
  <line x1="60" y1="120" x2="60" y2="180" stroke="#222" stroke-width="5"/>
  <line x1="60" y1="180" x2="110" y2="180" stroke="#222" stroke-width="5"/>
  <line x1="110" y1="120" x2="110" y2="180" stroke="#222" stroke-width="5"/>

  <!-- Vertical wall mid-top -->
  <line x1="240" y1="8" x2="240" y2="120" stroke="#222" stroke-width="5"/>

  <!-- Horizontal wall upper-right -->
  <line x1="340" y1="70" x2="420" y2="70" stroke="#222" stroke-width="5"/>
  <line x1="420" y1="70" x2="420" y2="140" stroke="#222" stroke-width="5"/>
  <line x1="340" y1="70" x2="340" y2="140" stroke="#222" stroke-width="5"/>

  <!-- Long horizontal mid -->
  <line x1="200" y1="200" x2="440" y2="200" stroke="#222" stroke-width="5"/>

  <!-- Vertical wall mid-bottom -->
  <line x1="160" y1="250" x2="160" y2="354" stroke="#222" stroke-width="5"/>

  <!-- Lower horizontal wall -->
  <line x1="160" y1="280" x2="320" y2="280" stroke="#222" stroke-width="5"/>

  <!-- Right-side lower wall -->
  <line x1="380" y1="260" x2="474" y2="260" stroke="#222" stroke-width="5"/>

  <!-- Bottom-right connector -->
  <line x1="250" y1="320" x2="420" y2="320" stroke="#222" stroke-width="5"/>

  <!-- ═══ MARKERS ═══ -->
  <!-- Apple goal at top exit -->
  <text x="110" y="38" font-size="28" text-anchor="middle">🍎</text>

  <!-- Start arrow at bottom-left entry -->
  <text x="40" y="340" font-size="22" text-anchor="middle">⭐</text>
</svg>
