<svg width="15.2mm" height="20.3mm" viewBox="0 0 15.2 20.3" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pin definition -->
    <g id="pin">
      <circle r=".7" cy="1.27" fill="#ffe680"/>
      <circle r=".45" cy="1.27" fill="#fff"/>
    </g>
    
    <!-- Gradients -->
    <linearGradient id="pcb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a9955;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#087f45;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="ic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- PCB Board (Green) -->
  <rect width="15.2" height="20.3" fill="url(#pcb-grad)" rx="0.5"/>
  <rect width="15.2" height="20.3" fill="none" stroke="#065f35" stroke-width="0.15"/>
  
  <!-- A4988 IC (Black square) -->
  <rect x="3.3" y="6.5" width="5" height="5" fill="url(#ic-grad)" stroke="#000" stroke-width="0.1"/>
  
  <!-- IC label -->
  <text x="5.8" y="9.5" font-family="Arial, sans-serif" font-size="0.8" fill="#fff" text-anchor="middle">A4988</text>
  
  <!-- Heatsink (Silver/Gray) -->
  <rect x="7.4" y="15.8" width="3" height="3" fill="#ccc" stroke="#999" stroke-width="0.1"/>
  
  <!-- Heatsink fins -->
  <line x1="7.4" y1="16.3" x2="10.4" y2="16.3" stroke="#999" stroke-width="0.05"/>
  <line x1="7.4" y1="16.8" x2="10.4" y2="16.8" stroke="#999" stroke-width="0.05"/>
  <line x1="7.4" y1="17.3" x2="10.4" y2="17.3" stroke="#999" stroke-width="0.05"/>
  <line x1="7.4" y1="17.8" x2="10.4" y2="17.8" stroke="#999" stroke-width="0.05"/>
  
  <!-- Potentiometer (Blue trim pot for VREF) -->
  <circle cx="8.9" cy="17.3" r="0.8" fill="#4a90e2" stroke="#2e5f8f" stroke-width="0.08"/>
  <circle cx="8.9" cy="17.3" r="0.5" fill="#6ba3e8"/>
  <line x1="8.9" y1="17.3" x2="9.3" y2="16.9" stroke="#2e5f8f" stroke-width="0.12" stroke-linecap="round"/>
  
  <!-- Capacitors -->
  <!-- Large electrolytic capacitor -->
  <ellipse cx="4.5" cy="13" rx="0.6" ry="0.9" fill="#1a1a1a" stroke="#666" stroke-width="0.05"/>
  <rect x="4.2" y="12.1" width="0.6" height="0.15" fill="#999"/>
  
  <!-- Small ceramic capacitors (yellow/tan) -->
  <rect x="10.5" y="8" width="0.4" height="0.7" rx="0.05" fill="#f4d03f" stroke="#d4a017" stroke-width="0.03"/>
  <rect x="10.5" y="9.5" width="0.4" height="0.7" rx="0.05" fill="#f4d03f" stroke="#d4a017" stroke-width="0.03"/>
  
  <!-- Left side pins (ENABLE, MS1, MS2, MS3, RESET, SLEEP, STEP, DIR) -->
  <use href="#pin" x="1.27" y="0"/>
  <use href="#pin" x="1.27" y="2.54"/>
  <use href="#pin" x="1.27" y="5.08"/>
  <use href="#pin" x="1.27" y="7.62"/>
  <use href="#pin" x="1.27" y="10.16"/>
  <use href="#pin" x="1.27" y="12.7"/>
  <use href="#pin" x="1.27" y="15.24"/>
  <use href="#pin" x="1.27" y="17.78"/>
  
  <!-- Right side pins (VMOT, GND, 2B, 2A, 1A, 1B, VDD, GND) -->
  <use href="#pin" x="13.93" y="0"/>
  <use href="#pin" x="13.93" y="2.54"/>
  <use href="#pin" x="13.93" y="5.08"/>
  <use href="#pin" x="13.93" y="7.62"/>
  <use href="#pin" x="13.93" y="10.16"/>
  <use href="#pin" x="13.93" y="12.7"/>
  <use href="#pin" x="13.93" y="15.24"/>
  <use href="#pin" x="13.93" y="17.78"/>
  
  <!-- Silkscreen labels (white text) -->
  <!-- Left side labels -->
  <text x="2.5" y="1.5" font-family="Arial, sans-serif" font-size="0.6" fill="#fff">EN</text>
  <text x="2.5" y="4" font-family="Arial, sans-serif" font-size="0.6" fill="#fff">MS1</text>
  <text x="2.5" y="6.5" font-family="Arial, sans-serif" font-size="0.6" fill="#fff">MS2</text>
  <text x="2.5" y="9" font-family="Arial, sans-serif" font-size="0.6" fill="#fff">MS3</text>
  <text x="2.5" y="11.5" font-family="Arial, sans-serif" font-size="0.6" fill="#fff">RST</text>
  <text x="2.5" y="14" font-family="Arial, sans-serif" font-size="0.6" fill="#fff">SLP</text>
  <text x="2.5" y="16.5" font-family="Arial, sans-serif" font-size="0.6" fill="#fff">STP</text>
  <text x="2.5" y="19" font-family="Arial, sans-serif" font-size="0.6" fill="#fff">DIR</text>
  
  <!-- Right side labels -->
  <text x="12.5" y="1.5" font-family="Arial, sans-serif" font-size="0.6" fill="#fff" text-anchor="end">VMOT</text>
  <text x="12.5" y="4" font-family="Arial, sans-serif" font-size="0.6" fill="#fff" text-anchor="end">GND</text>
  <text x="12.5" y="6.5" font-family="Arial, sans-serif" font-size="0.6" fill="#fff" text-anchor="end">2B</text>
  <text x="12.5" y="9" font-family="Arial, sans-serif" font-size="0.6" fill="#fff" text-anchor="end">2A</text>
  <text x="12.5" y="11.5" font-family="Arial, sans-serif" font-size="0.6" fill="#fff" text-anchor="end">1A</text>
  <text x="12.5" y="14" font-family="Arial, sans-serif" font-size="0.6" fill="#fff" text-anchor="end">1B</text>
  <text x="12.5" y="16.5" font-family="Arial, sans-serif" font-size="0.6" fill="#fff" text-anchor="end">VDD</text>
  <text x="12.5" y="19" font-family="Arial, sans-serif" font-size="0.6" fill="#fff" text-anchor="end">GND</text>
  
  <!-- Board title -->
  <text x="7.6" y="4" font-family="Arial, sans-serif" font-size="1.2" font-weight="bold" text-anchor="middle" fill="#fff">A4988</text>
</svg>
