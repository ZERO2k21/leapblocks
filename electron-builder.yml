appId: com.leapblocks.app
productName: LeapBlocks
directories:
  output: out
  buildResources: build
files:
  - dist/**/*
  - package.json
  - node_modules/**/*
  - remove_bg.py
  - electron/buildApk.js
win:
  icon: public/assets/Final_logo_b.png
  target:
    - target: squirrel
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"
asar: true
npmRebuild: true
extraResources:
  - from: public
    to: public
    filter:
      - "**/*"
  # ── QEMU binary for ESP32 simulation ──────────────────────────────────────
  # Run `node scripts/download-qemu.js` before building to populate resources/.
  # The binary is platform-specific; only the matching one will be present.
  - from: resources
    to: .
    filter:
      - "qemu-system-xtensa"
      - "qemu-system-xtensa.exe"
