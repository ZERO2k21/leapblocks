appId: com.creoleap.leapblocks
productName: LeapBlocks
copyright: Copyright © 2026 Creoleap Technologies Pvt. Ltd.
directories:
  output: out
  buildResources: .
files:
  - dist/**/*
  - package.json
  - node_modules/**/*
  - src/studio/apk/**/*
  - tools/**/*
asar: true
asarUnpack:
  - node_modules/serialport/**/*
  - node_modules/@serialport/**/*
npmRebuild: false
win:
  icon: public/assets/leapblocks.ico
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: LeapBlocks
  menuCategory: Creoleap
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  include: installer/installer.nsh
extraResources:
  - from: public
    to: public
    filter:
      - "**/*"
  - from: tools
    to: tools
    filter:
      - "**/*"
  # arduino-cli removed from bundled resources.
  # It is downloaded on-demand at first use to avoid distributing GPL v3
  # software in our proprietary installer. See src/utils/ensureArduinoCli.ts
