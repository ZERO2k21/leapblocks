<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 310" width="200" height="310">
  <!-- Spark - Talk/Present pose placeholder. Replace with your generated PNG. -->
  <!-- Orange spiky hair -->
  <ellipse cx="100" cy="58" rx="44" ry="38" fill="#FF6B1A"/>
  <polygon points="62,40 52,10 76,34" fill="#FF6B1A"/>
  <polygon points="82,24 80,0 96,27" fill="#FF6B1A"/>
  <polygon points="108,22 112,0 122,27" fill="#FF6B1A"/>
  <polygon points="132,34 150,8 140,40" fill="#FF6B1A"/>
  <!-- Face - talking/presenting -->
  <ellipse cx="100" cy="78" rx="37" ry="34" fill="#FFCBA4"/>
  <!-- Eyes - friendly -->
  <circle cx="87" cy="74" r="7" fill="#3D2B1F"/>
  <circle cx="113" cy="74" r="7" fill="#3D2B1F"/>
  <circle cx="89" cy="72" r="2.5" fill="white"/>
  <circle cx="115" cy="72" r="2.5" fill="white"/>
  <!-- Open mouth talking -->
  <path d="M 85 90 Q 100 106 115 90" stroke="#3D2B1F" stroke-width="2.5" fill="#FF9999" stroke-linecap="round"/>
  <!-- Freckles -->
  <circle cx="79" cy="84" r="2" fill="#E8A882" opacity="0.7"/>
  <circle cx="121" cy="84" r="2" fill="#E8A882" opacity="0.7"/>
  <!-- Yellow hoodie body -->
  <rect x="62" y="110" width="76" height="88" rx="12" fill="#FFD700"/>
  <!-- Lightning bolt -->
  <polygon points="95,128 88,150 98,150 93,170 112,146 101,146 107,128" fill="white"/>
  <!-- Hoodie pocket -->
  <rect x="72" y="168" width="56" height="24" rx="6" fill="#E6C200"/>
  <!-- Left arm - hand in pocket -->
  <rect x="38" y="115" width="26" height="68" rx="13" fill="#FFD700"/>
  <!-- Right arm - raised presenting gesture -->
  <rect x="136" y="100" width="26" height="72" rx="13" fill="#FFD700" transform="rotate(-30 149 136)"/>
  <!-- Left hand in pocket -->
  <ellipse cx="51" cy="188" rx="13" ry="11" fill="#FFCBA4"/>
  <!-- Right hand open/presenting -->
  <ellipse cx="162" cy="118" rx="14" ry="12" fill="#FFCBA4" transform="rotate(-30 162 118)"/>
  <!-- Blue jeans -->
  <rect x="68" y="198" width="30" height="82" rx="8" fill="#4A90D9"/>
  <rect x="102" y="198" width="30" height="82" rx="8" fill="#4A90D9"/>
  <!-- Jeans cuffs -->
  <rect x="68" y="268" width="30" height="12" rx="4" fill="#3A7BC8"/>
  <rect x="102" y="268" width="30" height="12" rx="4" fill="#3A7BC8"/>
  <!-- Red sneakers -->
  <rect x="54" y="278" width="44" height="14" rx="7" fill="#CC2200"/>
  <rect x="102" y="278" width="44" height="14" rx="7" fill="#CC2200"/>
  <!-- Shoe laces -->
  <line x1="60" y1="283" x2="92" y2="283" stroke="white" stroke-width="1.5"/>
  <line x1="108" y1="283" x2="140" y2="283" stroke="white" stroke-width="1.5"/>
</svg>
